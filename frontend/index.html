<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BaixaAí</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex justify-center items-center min-h-screen">

  <!-- Main container -->
  <div class="container mx-auto px-4 md:px-0 text-center">
    <h1 class="text-4xl font-bold mb-6">BaixaAí</h1>

    <!-- Input fields -->
    <div class="space-y-4">
      <input id="youtubeLink" type="text" placeholder="Cole o link do YouTube aqui" 
             class="w-full p-3 rounded bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-gray-600">
      
      <div class="flex justify-between">
        <select id="conversionType" class="w-[48%] p-3 rounded bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-gray-600">
          <option value="mp3">MP3</option>
          <option value="mp4">MP4</option>
        </select>

        <select id="quality" class="w-[48%] p-3 rounded bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-gray-600">
          <option value="high">Alta Qualidade</option>
          <option value="medium">Qualidade Média</option>
          <option value="low">Baixa Qualidade</option>
        </select>
      </div>

      <button id="convertButton" class="w-full p-3 rounded bg-gray-700 hover:bg-gray-600 transition font-bold">
        Converter
      </button>
    </div>

    <!-- Loading state -->
    <div id="loading" class="hidden mt-6">
      <p>Convertendo...</p>
      <div class="mt-2 w-full h-2 bg-gray-800 rounded">
        <div class="bg-white h-2 rounded animate-pulse"></div>
      </div>
    </div>

    <!-- Download section -->
    <div id="downloadSection" class="hidden mt-6">
      <a id="downloadButton" href="#" download 
         class="w-full block p-3 rounded bg-green-600 hover:bg-green-500 transition font-bold text-center">
        Baixar Arquivo
      </a>
      <p id="newConversionMessage" class="mt-4">Deseja realizar uma nova conversão?</p>
      <div class="flex justify-center space-x-4 mt-2">
        <button id="yesButton" class="p-2 bg-gray-700 hover:bg-gray-600 rounded">Sim</button>
        <button id="noButton" class="p-2 bg-gray-700 hover:bg-gray-600 rounded">Não</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
